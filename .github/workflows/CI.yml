name: React CI

on:
  push:
    branches:
      - "develop/**"

  pull_request:
    branches:
      - "develop/default"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build
